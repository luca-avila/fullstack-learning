<script>
  // javascript.info: https://javascript.info/while-for
  // Keep asking for a number until the visitor enters one greater than 100 or cancels.
  let n = 0;

  while (n !== null && n !== "" && n <= 100) {
    n = prompt("Write a number greater than 100");
  }

  // ------------------------
  // Prime numbers: ask for a number and check whether it's prime.

  n = prompt("Write a prime number");

  let isPrime = n >= 2;

  for (let i = 2; i < n; i++) {
    if (n % i === 0) {
      isPrime = false;
      break;
    }
  }

  alert(isPrime ? "It's prime" : "It's not a prime number");
</script>
