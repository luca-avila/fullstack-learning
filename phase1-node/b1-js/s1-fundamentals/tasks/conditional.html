<script>
  // javascript.info: https://javascript.info/ifelse
  // Check the login: "Admin" is asked for a password ("TheMaster"), anyone else is unknown.
  // Handle a cancel at each step.
  let user = prompt("Who's there?");

  if (user == null) {
    alert("Cancel");
  } else if (user.toLowerCase() !== "admin") {
    alert("Unknown");
  } else {
    let pass = prompt("Password?");

    if (pass === null) {
      alert("Cancelled");
    } else if (pass !== "TheMaster") {
      alert("Wrong password!");
    } else {
      alert("Welcome!");
    }
  }
</script>
