<script>
  // javascript.info: https://javascript.info/switch
  // Rewrite an if/else chain that checks `a` against 0, 1, and 2 or 3 using switch.
  let a = prompt("a?", "");

  switch (+a) {
    case 0:
      alert(0);
      break;
    case 1:
      alert(1);
      break;
    case 2:
    case 3:
      alert("2, 3");
      break;
  }
</script>
